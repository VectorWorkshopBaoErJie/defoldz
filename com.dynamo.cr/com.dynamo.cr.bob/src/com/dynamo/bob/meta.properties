[physics]
help = 物理设置
group = Runtime

max_collision_object_count.type = integer
max_collision_object_count.help = 最大碰撞对象数量，默认为 128
max_collision_object_count.label = 最大碰撞对象数
max_collision_object_count.default = 128

type.type = string
type.help = 使用的物理类型，2D（默认）或 3D
type.label = 物理类型
type.default = 2D
type.options = 2D,3D

use_fixed_timestep.type = bool
use_fixed_timestep.help = 物理是否使用固定时间步长。参见 engine.fixed_update_frequency
use_fixed_timestep.label = 使用固定时间步长
use_fixed_timestep.default = 0

debug.type = bool
debug.help = 可视化物理以进行调试
debug.label = 调试可视化
debug.default = 0

debug_alpha.type = number
debug_alpha.help = 可视化物理的 Alpha 分量，0 - 1 默认为 0.9
debug_alpha.label = 调试 Alpha 值
debug_alpha.default = 0.9

debug_scale.type = number
debug_scale.help = 绘制物理中单位对象(如三元组和法线)的大小，默认为 30
debug_scale.label = 调试缩放
debug_scale.default = 30

world_count.type = integer
world_count.help = 最大并发物理世界数量，默认为 4 (注意，它们会浪费内存)
world_count.label = 物理世界数量
world_count.default = 4

gravity_x.type = number
gravity_x.help = 世界重力沿 X 轴的分量，默认为 0
gravity_x.label = X 轴重力
gravity_x.default = 0

gravity_y.type = number
gravity_y.help = 世界重力沿 Y 轴的分量，默认为 -10 (自然重力)
gravity_y.label = Y 轴重力
gravity_y.default = -10

gravity_z.type = number
gravity_z.help = 世界重力沿 Z 轴的分量，默认为 0
gravity_z.label = Z 轴重力
gravity_z.default = 0

scale.type = number
scale.help = 为了数值精度，物理世界相对于游戏世界的缩放比例，默认 0.01 - 1
scale.label = 物理缩放
scale.default = 1

allow_dynamic_transforms.type = bool
allow_dynamic_transforms.help = 如果设置，允许设置动态刚体的缩放、位置和旋转 默认为 true
allow_dynamic_transforms.label = 允许动态变换
allow_dynamic_transforms.default = 1

max_collisions.type = integer
max_collisions.help = 将报告给脚本的碰撞数量，默认为 64
max_collisions.label = 最大碰撞数
