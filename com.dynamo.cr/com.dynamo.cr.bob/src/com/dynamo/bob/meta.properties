[]
group-order = Main,Platforms,Components,Runtime,Distribution
default-category = project

[project]
help = 常规项目设置
group = Main

title.type = string
title.help = 应用程序的标题
title.label = 应用程序标题
title.default = unnamed

version.type = string
version.help = 应用程序版本
version.label = 应用程序版本
version.default = 1.0

publisher.type = string
publisher.help = 发布者名称
publisher.label = 发布者名称
publisher.default =

developer.type = string
developer.help = 开发者名称
developer.label = 开发者名称
developer.default =

write_log.type = bool
write_log.help = 将日志文件写入磁盘
write_log.label = 写入日志文件
write_log.default = 0
write_log.deprecated = 1

write_log_file.type = integer
write_log_file.help = 将日志文件写入磁盘
write_log_file.label = 写入日志文件
write_log_file.default = 0
write_log_file.options = 0:Never,1:Debug,2:Always

minimum_log_level.type = string
minimum_log_level.help = 仅显示最低日志级别及更高级别的日志
minimum_log_level.label = 最低日志级别
minimum_log_level.default = 1
minimum_log_level.options = 0:DEBUG = 0,1:USER DEBUG = 1,2:INFO = 2,3:WARNING = 3,4:ERROR = 4,5:FATAL = 5

compress_archive.type = bool
compress_archive.help = 压缩存档 不适用于 Android
compress_archive.label = 压缩存档
compress_archive.default = 1

dependencies.type = string_array
dependencies.element = type=url&default=https://url.to/library
dependencies.help = 此项目所需项目的 URL 列表
dependencies.label = 项目依赖项
dependencies.private = 1

custom_resources.help = 将包含在项目中的资源列表 逗号分隔 。如果指定了目录，则该目录中的所有文件和目录将被递归包含
custom_resources.type = string
custom_resources.label = 自定义资源

bundle_resources.type = string
bundle_resources.help = 包含资源文件和文件夹的目录，在打包时应原样复制到最终包中
bundle_resources.label = 打包资源目录

bundle_exclude_resources.help = 不应包含在包中的资源列表 逗号分隔
bundle_exclude_resources.type = string
bundle_exclude_resources.label = 打包排除资源

[display]
help = 分辨率及其他显示相关设置
group = Runtime

width.type = integer
width.help = 应用程序窗口的宽度，默认为 960 像素
width.label = 窗口宽度
width.default = 960

height.type = integer
height.help = 应用程序窗口的高度 ，默认为 640 像素
height.label = 窗口高度
height.default = 640

high_dpi.type = bool
high_dpi.help = 在可用时启用高 DPI 后备缓冲区
high_dpi.label = 启用高 DPI
high_dpi.default = 0

samples.type = integer
samples.help = 用于超采样抗锯齿的样本数，默认为 0 表示关闭
samples.label = 抗锯齿样本数
samples.default = 0

fullscreen.type = bool
fullscreen.help = 以全屏模式而非窗口模式启动应用程序
fullscreen.label = 全屏模式
fullscreen.default = 0

display_profiles.type = resource
display_profiles.help = 应用程序使用的显示配置文件文件引用
display_profiles.label = 显示配置文件
display_profiles.default = /builtins/render/default.display_profilesc
display_profiles.filter = display_profiles

dynamic_orientation.type = bool
dynamic_orientation.help = 动态屏幕方向支持
dynamic_orientation.label = 动态方向
dynamic_orientation.default = 0

update_frequency.type = integer
update_frequency.help = 每秒游戏循环更新次数。设置为 0 表示可变帧率。设置为例如 30 以限制更新频率。
update_frequency.label = 更新频率
update_frequency.default = 0

swap_interval.type = integer
swap_interval.help = 垂直同步间隔。0 表示禁用
swap_interval.label = 交换间隔
swap_interval.default = 1

vsync.type = bool
vsync.help = 垂直同步，依赖硬件垂直同步进行帧计时。可能会因图形驱动程序和平台 specifics 而被覆盖。对于已弃用的 'variable_dt' 行为，请取消选中此设置并将帧上限设置为 0
vsync.label = 垂直同步
vsync.default = 1

variable_dt.type = bool
variable_dt.help = 此设置已弃用。选中时，将禁用“垂直同步”并将“帧上限”设置为 0 以获得等效行为。
variable_dt.label = 可变 Delta 时间
variable_dt.default = 0
variable_dt.deprecated = 1
variable_dt.severity-override = fatal
variable_dt.severity-default = warning

display_device_info.type = bool
display_device_info.help = 在启动时将 GPU 信息输出到控制台
display_device_info.label = 显示设备信息
display_device_info.default = 0

