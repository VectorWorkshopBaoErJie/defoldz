max_contacts.type = integer
max_contacts.help = 将报告给脚本的接触点数量，默认为 128
max_contacts.label = 最大接触点数
max_contacts.default = 128

contact_impulse_limit.type = number
contact_impulse_limit.help = 冲量低于此限制的接触将不会报告给脚本，默认为 0 禁用
contact_impulse_limit.label = 接触冲量限制
contact_impulse_limit.default = 0

ray_cast_limit_2d.type = integer
ray_cast_limit_2d.help = 使用 2D 物理时每帧的最大射线投射数量
ray_cast_limit_2d.label = 2D 射线投射限制
ray_cast_limit_2d.default = 64

ray_cast_limit_3d.type = integer
ray_cast_limit_3d.help = 使用 3D 物理时每帧的最大射线投射数量
ray_cast_limit_3d.label = 3D 射线投射限制
ray_cast_limit_3d.default = 128

trigger_overlap_capacity.type = integer
trigger_overlap_capacity.help = 可检测的最大重叠触发器数量，默认为 16
trigger_overlap_capacity.label = 触发器重叠容量
trigger_overlap_capacity.default = 16

velocity_threshold.type = number
velocity_threshold.help = 导致弹性碰撞的最小速度
velocity_threshold.label = 速度阈值
velocity_threshold.default = 1

max_fixed_timesteps.type = integer
max_fixed_timesteps.help = 使用固定时间步长时模拟中的最大步数 仅 3D
max_fixed_timesteps.label = 最大固定时间步长数
max_fixed_timesteps.default = 2

